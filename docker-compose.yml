# Sensei — Local Development Infrastructure
# Usage: docker-compose up -d
# Stops: docker-compose down

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sensei-postgres
    environment:
      POSTGRES_USER: sensei
      POSTGRES_PASSWORD: sensei_password
      POSTGRES_DB: sensei_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensei -d sensei_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sensei-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── ChromaDB ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: sensei-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  chromadata:
