version: "3.8"

# Sensei — Local Development Infrastructure
# Usage: docker-compose up -d
# Stops: docker-compose down

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sensei-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sensei-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── ChromaDB ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma
    container_name: sensei-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/data
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  pgdata:
  redisdata:
  chromadata:
